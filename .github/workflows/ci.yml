name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bun:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test, build
        run: bunx turbo typecheck lint test build

      - name: Module boundary check
        run: bun run check:boundaries

      - name: Dependency audit
        run: bun audit --audit-level=high

  rust:
    name: Rust check (desktop shell and native helper)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check desktop shell
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Check and test native helper
        if: ${{ hashFiles('services/hands/Cargo.toml') != '' }}
        run: |
          cargo check --manifest-path services/hands/Cargo.toml
          cargo test --manifest-path services/hands/Cargo.toml
