# Builds the Windows beta installer (NSIS, per-user) on a Windows runner and
# attaches it to an existing GitHub release. Run by hand from the Actions tab.
name: Release desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installer to
        required: true
        default: v0.1.0-beta

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the installer
        run: bun run --cwd apps/desktop build

      - name: Upload the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "tag '$TAG' is not a release tag like v0.1.0-beta" >&2
            exit 1
          fi
          gh release view "$TAG" > /dev/null || { echo "release $TAG does not exist; create it first" >&2; exit 1; }
          shopt -s nullglob
          files=(apps/desktop/dist/*-setup.exe)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "expected one installer in apps/desktop/dist, found ${#files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[0]}"
          gh release upload "$TAG" "${files[0]}" --clobber
