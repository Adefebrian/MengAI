[package]
name = "mengai-desktop"
version = "0.1.0-beta"
description = "MengAI desktop shell (macOS, Windows): spawns the compiled Bun API sidecar and hosts the web app"
authors = ["Adefebrian"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
# 1.89: std File::try_lock for the data dir lock on macOS and Windows.
rust-version = "1.89"
publish = false

[[bin]]
name = "mengai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# kill(2) and killpg(2): SIGTERM to the sidecar, SIGKILL to its process group.
# Already in the lockfile through tauri; JEV be.new_tech adopt 0.96. Windows
# uses a job object instead (src/winproc.rs, no crate).
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
# One app per computer: a second launch hands off to the running instance (which
# shows its window) and exits before it starts an engine. Official Tauri
# plugin, deps already in the lockfile through tauri; JEV be.new_tech adopt 0.94.
tauri-plugin-single-instance = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
