[package]
name = "mengai-desktop"
version = "0.1.0"
description = "MengAI macOS shell: spawns the compiled Bun API sidecar and hosts the web app"
authors = ["Adefebrian"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "mengai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# kill(2) and killpg(2) only: SIGTERM to the sidecar, SIGKILL to its process
# group. Already in the lockfile through tauri; JEV be.new_tech adopt 0.96.
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
