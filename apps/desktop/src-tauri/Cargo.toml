[package]
name = "mengai-desktop"
version = "0.1.0-beta"
description = "MengAI desktop shell (macOS, Windows): spawns the compiled Bun API sidecar and hosts the web app"
authors = ["Adefebrian"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
# 1.89: std File::try_lock for the data dir lock on macOS and Windows.
rust-version = "1.89"
publish = false

[[bin]]
name = "mengai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# macos-private-api: the transparent island window (tauri.conf.json app.macOSPrivateApi).
# It rules out the Mac App Store, which MengAI does not ship to (dmg only).
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# kill(2) and killpg(2): SIGTERM to the sidecar, SIGKILL to its process group.
# Already in the lockfile through tauri; JEV be.new_tech adopt 0.96. Windows
# uses a job object instead (src/winproc.rs, no crate).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The island on the notch (src/island.rs): NSScreen safe area and auxiliary top
# areas, the window level above the menu bar, collection behavior, a frame set in
# one call, the screen change notification and always active copies of the web
# view's tracking areas (hover while the island is not key). Tauri exposes none
# of these. All
# four crates are already in Cargo.lock at these versions through tauri, tao and
# wry, so nothing new enters the build; only feature flags are added. JEV
# be.new_tech declare_locked_crates 1.0.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSResponder",
  "NSScreen",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
# One app per computer: a second launch hands off to the running instance (which
# shows its window) and exits before it starts an engine. Official Tauri
# plugin, deps already in the lockfile through tauri; JEV be.new_tech adopt 0.94.
tauri-plugin-single-instance = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
